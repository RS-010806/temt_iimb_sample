name: Verify TEMT preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Check source snapshot integrity
        run: python3 docs/scripts/check-source-data.py
      - name: Build shared calculator
        run: npm run build:calculator
      - name: Check types
        run: npm run check
      - name: Run calculation and API tests
        run: npm test
      - name: Build static frontend
        run: npm run build:web
      - name: Build API
        run: npm run build:api
      - name: Confirm build outputs
        run: |
          test -s apps/web/out/index.html
          test -s apps/web/out/data/nifty500.json
          test -d apps/api/dist
      - name: Upload frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temt-web-${{ github.sha }}
          path: apps/web/out
          if-no-files-found: error
          retention-days: 14
      - name: Upload API artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temt-api-${{ github.sha }}
          path: |
            apps/api/dist
            packages/calculator/dist
          if-no-files-found: error
          retention-days: 14
